[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evals"
version = "0.1.0"
description = "Deterministic evaluation harness for LLM agents: golden cases, verifiable graders, a pass-rate threshold. No LLM judge."
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ramiro Cerda" }]
readme = "README.md"
keywords = ["llm", "agents", "evals", "testing", "ci", "deterministic"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
